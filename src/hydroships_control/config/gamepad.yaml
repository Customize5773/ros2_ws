# Konfigurasi teleop_gamepad (Logitech F310, skema gaya QGroundControl/ArduSub).
#
# Index axis/button di bawah berasal dari config joystick eksternal (X-input,
# Linux). Verifikasi ulang dengan `ros2 topic echo /joy` sebelum dipakai —
# mapping fisik bisa berbeda tergantung driver/kernel, terutama D-pad/tombol
# tambahan. Skala -1000..1000 dari config asal (unit internal QGC) TIDAK
# dipakai di sini; expo curve diterapkan pada axis mentah [-1,1] lalu discale
# ke unit fisik (N, N*m, rad/s, m/s) oleh teleop_gamepad.py.
#
# Tombol tanpa backend di hydroships_control (mode_poshold, arm, disarm,
# mount_tilt_up/down, gain_inc/dec) dibaca tapi hanya di-log — tidak publish
# ke topic manapun sampai backend-nya tersedia.
teleop_gamepad:
  ros__parameters:
    publish_rate: 20.0
    joy_topic: /joy
    # true  = semua perintah lewat /hydroships/manual/cmd + /hydroships/control_mode
    #         (dipakai bersama hydroships_stabilized.launch.py yang menjalankan stabilizer).
    # false = publish wrench langsung ke /hydroships/cmd_vel seperti teleop_keyboard
    #         (dipakai bersama hydroships_sim.launch.py yang TANPA stabilizer).
    # Dua publisher di /hydroships/cmd_vel akan saling berebut -> jangan set false
    # saat stabilizer jalan.
    route_through_stabilizer: true
    deadzone: 0.12
    expo: 1.6
    max_force: 20.0          # N, untuk Fx/Fy/Fz
    max_torque: 5.0           # N*m, untuk Mz (mode manual)
    max_heading_rate: 1.0     # rad/s, skala axis yaw di mode depth_hold/poshold
    max_depth_rate: 0.5       # m/s, skala axis heave di mode depth_hold/poshold

    # Konvensi ArduSub: Axis X = maju (surge), Axis Y = lateral (sway),
    # Axis Z = throttle (heave), Axis R = yaw. Glyph arah di config asal
    # (axis0 ↔, axis1 ↕, axis2 ↔, axis3 ↕) = left-X, left-Y, right-X, right-Y.
    axes:
      yaw: 0        # Axis R  (left stick  ↔)
      heave: 1      # Axis Z  (left stick  ↕)
      sway: 2       # Axis Y  (right stick ↔) - lateral
      surge: 3      # Axis X  (right stick ↕) - maju/mundur
    # PENTING: flag invert WAJIB diverifikasi dengan `ros2 topic echo /joy`.
    # QGroundControl/SDL dan ROS `joy` memakai konvensi tanda yang berbeda untuk
    # sumbu Y stick, jadi nilai dari config QGC tidak selalu berpindah apa adanya.
    # Dorong stick MAJU -> linear.x harus positif; dorong KANAN -> ROV geser kanan.
    axes_invert_yaw: false
    axes_invert_heave: true
    axes_invert_sway: false
    axes_invert_surge: true

    buttons_shift: 16

    buttons_regular_mode_poshold: 0
    buttons_regular_mode_manual: 1
    buttons_regular_emergency_stop: 2
    buttons_regular_mode_depth_hold: 3
    buttons_regular_mount_tilt_up: 4
    buttons_regular_grip_close: 5
    buttons_regular_mount_tilt_down: 6
    buttons_regular_grip_open: 7
    buttons_regular_disarm: 8
    buttons_regular_arm: 9
    buttons_regular_gain_dec: 12
    buttons_regular_gain_inc: 13

    buttons_shift_gain_dec: 12
    buttons_shift_gain_inc: 13
    buttons_shift_mount_tilt_up: 14
    buttons_shift_mount_tilt_down: 15

    cmd_vel_topic: /hydroships/cmd_vel
    manual_cmd_topic: /hydroships/manual/cmd
    depth_setpoint_topic: /hydroships/setpoint/depth
    heading_setpoint_topic: /hydroships/setpoint/heading
    gripper_cmd_topic: /hydroships/gripper/command
    control_mode_topic: /hydroships/control_mode
    odom_topic: /hydroships/odom
