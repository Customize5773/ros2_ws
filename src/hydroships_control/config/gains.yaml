# Gain PID stabilizer HYDROships (Milestone 2).
# Titik awal untuk model M1: near-neutral, massa ~8.7 kg (base_mass 8.3 + 6
# thruster + gripper, lihat hydroships_description/config/rov_params.yaml).
# Massa efektif heave ~13 kg setelah added mass (zDotW -4.614).
# Setel ulang setelah massa/koefisien hidrodinamika di-tune ke ROV asli.
stabilizer:
  ros__parameters:
    use_sim_time: true
    rate: 20.0

    # Diturunkan dari 60/8/40 (ilim 30) yang disetel untuk perkiraan massa lama
    # ~33.9 kg — terlalu agresif untuk badan ~8.7 kg dan ikut menyebabkan osilasi.
    depth:
      kp: 35.0
      ki: 4.0
      kd: 30.0
      integral_limit: 15.0
      out_limit: 60.0      # batas |Fz| (N)

    heading:
      kp: 8.0
      ki: 0.5
      kd: 4.0
      integral_limit: 5.0
      out_limit: 15.0      # batas |Mz| (N*m)

    # Pitch/roll-hold: lapisan robustness ringan (koreksi kecil), restoring
    # moment pasif utama berasal dari CoB di atas CoG (lihat rov_params.yaml).
    pitch:
      kp: 6.0
      ki: 0.3
      kd: 3.0
      integral_limit: 5.0
      out_limit: 15.0      # batas |My| (N*m)

    roll:
      kp: 6.0
      ki: 0.3
      kd: 3.0
      integral_limit: 5.0
      out_limit: 15.0      # batas |Mx| (N*m)

    # Gaya apung bersih dgn base_mass=8.3kg + gripper 0.1kg + 6 thruster (total
    # ~8.7 kg) vs collision box buoyancy yg sudah diskalakan (rov_params.yaml:
    # buoyancy_collision, ~8.73 kg air terpindah) -> net apung ke atas kecil
    # (~+0.28 N), near-neutral spt filosofi desain M1 awal. Jauh di bawah batas
    # thruster (~120N), jadi aman dikompensasi PID+FF kecil ini.
    buoyancy_ff: -0.3

    target_depth: -0.1     # meter, negatif = di bawah permukaan
    target_heading: 0.0    # radian
    target_pitch: 0.0      # radian
    target_roll: 0.0       # radian

    enable_depth_hold: true
    enable_heading_hold: true
    enable_pitch_hold: true
    enable_roll_hold: true
