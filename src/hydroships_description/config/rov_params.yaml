# rov_params.yaml — Parameter FISIK ROV HYDROships (KKI 2026)
# ==========================================================================
# Dipisah dari hydroships.urdf.xacro agar massa, CoG/CoB, inertia, dan
# koefisien hidrodinamika bisa diganti TANPA menyunting URDF langsung.
# URDF memuat file ini via xacro.load_yaml('../config/rov_params.yaml').
#
# STATUS TIAP NILAI (lihat PROBLEM.md):
#   [estimate]  = placeholder / turunan geometri box / acuan tipe BlueROV2.
#                 BUKAN data ROV HYDROships nyata — masih perlu pengukuran.
#   [measured]  = sudah dari pengukuran/known-value nyata.
#
# CARA ISI DATA NYATA:
#   1. Ukur dimensi/massa/material ROV final.
#   2. Jalankan scripts/estimate_mass_inertia.py (mis. --dims X Y Z --mass M
#      atau --density RHO, tambah --point-mass utk komponen) -> salin blok
#      base_mass/cog/inertia ke sini.
#   3. Ganti koefisien hidrodinamika dgn hasil uji tarik/CFD bila ada.
#   4. Ubah tag [estimate] -> [measured] pada nilai yg sudah tervalidasi.
#   Frame: ROS REP-103 (x maju, y kiri, z atas). Satuan SI.
# ==========================================================================

# --- Massa ---
base_mass: 8.3           # kg   [measured] bobot ROV (tanpa gripper/thruster).
thruster_mass: 0.05      # kg   [estimate] massa tiap link thruster.

# --- Massa jenis fluida (air kolam) ---
fluid_density: 1000.0    # kg/m^3  [measured] air tawar; dipakai plugin
                         #         Hydrodynamics & Thruster.

# --- Dimensi collision box untuk BUOYANCY (bukan bbox visual/mounting body_x/y/z
# di urdf.xacro) ---
# Rangka ROV asli berongga (frame terbuka), bukan kotak solid penuh; volume
# perpindahan air efektif hanya berasal dari kompartemen tersegel (elektronik +
# busa apung), jadi dibuat LEBIH KECIL dari bbox luar 0.345x0.345x0.286 m.
# Diskalakan (faktor ~0.635, rasio sisi sama dgn bbox luar) agar massa air
# terpindah (~8.73 kg) mendekati massa total sistem (~8.7 kg: base 8.3 + 6
# thruster 0.3 + gripper 0.1) -> near-neutral, sedikit positif (sama filosofi
# desain M1, lihat catatan di atas urdf.xacro). GANTI bila hull final berbeda.
#
# PENTING — neraca ini hanya sahih selama base_link adalah SATU-SATUNYA link ROV
# yang punya <collision>. Plugin gz Buoyancy menghitung volume perpindahan dari
# geometri <collision>, jadi setiap link yang diberi collision ikut menghasilkan
# gaya apung. Karena itu thruster DAN gripper sengaja tanpa collision di
# urdf.xacro. Riwayat: ketiga link gripper sempat punya collision -> menambah
# 0.677 kg air terpindah di haluan (x=+0.18..0.26 m) sehingga net apung jadi
# +6.92 N (bukan +0.28 N) dan CoB bergeser +13.6 mm ke depan -> momen bow-up
# 1.04 N*m melawan momen pemulih maks 1.69 N*m -> ROV trim ~31 deg bow-up dan
# dorongan "vertikal" terproyeksi jadi gerak horizontal. Jangan tambahkan
# <collision> ke link ROV tanpa menghitung ulang neraca di bawah.
#
# Neraca yang berlaku sekarang:
#   terpindah 0.008729 m^3 = 8.729 kg -> apung 85.63 N
#   berat     8.700 kg               -> 85.35 N
#   net apung = +0.28 N ke atas (dikompensasi stabilizer buoyancy_ff = -0.3 N)
buoyancy_collision: {x: 0.219, y: 0.219, z: 0.182}

# --- Center of Gravity (offset dari origin base_link) ---
cog: {x: 0.0, y: 0.0, z: 0.0}   # m  [estimate] origin = pusat bbox.

# --- Center of Buoyancy (offset dari origin base_link) ---
# DIPAKAI: menggeser origin <collision> base_link (hydroships.urdf.xacro) sebesar
# nilai ini. Buoyancy sim (graded_buoyancy, gz-sim-buoyancy-system) dihitung dari
# volume collision-box, jadi menggeser origin box = menggeser CoB efektif.
# CoB di atas CoG (z>0) -> metacentric height positif -> restoring moment pasif
# utk pitch/roll (mencegah ROV drift pitch/roll tanpa batas saat hold aktif).
cob: {x: 0.0, y: 0.0, z: 0.02}  # m  [estimate] sedikit di atas CoG (stabil).

# --- Tensor inertia base_link di CoG (kg*m^2) ---
# [estimate] diturunkan dari box pejal 0.345 x 0.345 x 0.286 m @ base_mass=8.3 kg
# via scripts/estimate_mass_inertia.py --dims 0.345 0.345 0.286 --mass 8.3
inertia:
  ixx: 0.13890
  iyy: 0.13890
  izz: 0.16465
  ixy: 0.0
  ixz: 0.0
  iyz: 0.0

# --- Koefisien hidrodinamika (model Fossen) ---
# SEMUA [estimate]: nilai acuan tipe BlueROV2 (~33.6 kg), diskalakan proporsional
# dgn rasio massa (8.3/33.6 ~ 0.247) setelah base_mass diturunkan ke 8.3 kg.
# PENTING: koefisien ini (terutama added_mass) TIDAK BOLEH lebih besar dari
# base_mass -- kalau added_mass >> massa benda, simulator jadi numerically stiff
# dan gz-sim-physics (ODE/dartsim) bisa crash ("aabbBound" assertion) di step
# awal karena solver kontak/constraint tak sanggup menangani rasio massa efektif
# yg ekstrem. Ganti dgn hasil identifikasi (uji tarik / CFD) saat tersedia; kalau
# base_mass diubah lagi, SKALAKAN ULANG semua nilai di bawah dgn rasio yg sama.
# Tanda negatif = gaya reaktif melawan gerak (konvensi plugin gz Hydrodynamics).
added_mass:            # gaya reaktif ~ percepatan
  xDotU: -1.571
  yDotV: -1.759
  zDotW: -4.614
  kDotP: -0.0467
  mDotQ: -0.0334
  nDotR: -0.0548
linear_damping:        # gaya reaktif ~ kecepatan
  xU: -2.890
  yV: -4.940
  zW: -7.880
  kP: -6.176
  mQ: -10.869
  nR: -1.235
quadratic_damping:     # gaya reaktif ~ kecepatan*|kecepatan|
  xUabsU: -4.491
  yVabsV: -5.351
  zWabsW: -9.137
  kPabsP: -0.383
  mQabsQ: -0.383
  nRabsR: -0.383
